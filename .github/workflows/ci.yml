name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: check + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain versions
        run: moon version --all

      - name: Update registry index
        # The runner image ships a stale index; without this the pinned
        # moonbitlang/x version cannot be resolved.
        run: moon update

      - name: Type check every target
        # No --deny-warn here. The runner installs the current toolchain, which
        # adds deprecation warnings over time; failing on those would make CI go
        # red for reasons that are not about this code. The warning count is
        # still printed, and the local gate (`moon check --deny-warn` on the
        # toolchain in the README) stays clean.
        run: moon check --target all

      - name: Unit tests
        run: moon test --target wasm

      - name: CLI validates against a real schema
        # Assert the exact lines rather than the exit status. This tool does not
        # set one, and a mis-parsed argv prints INVALID for every input, so a
        # grep for "INVALID" alone passes on a broken build.
        run: |
          out=$(moon run --target js cmd/main -- --schema examples/invoice.xsd amount 100.50 99999999.99)
          echo "$out"
          echo "$out" | grep -qxF 'valid    amount  100.50  =>  100.5'
          echo "$out" | grep -qxF 'valid    amount  99999999.99  =>  99999999.99'
          ! echo "$out" | grep -q INVALID

      - name: Invalid values are rejected, for the stated reason
        run: |
          out=$(moon run --target js cmd/main -- --schema examples/invoice.xsd amount 100000000 1.234)
          echo "$out"
          echo "$out" | grep -qxF 'INVALID  amount  100000000  =>  facet violation: value is above maxInclusive'
          echo "$out" | grep -qxF 'INVALID  amount  1.234  =>  facet violation: fractionDigits 3 exceeds 2'

      - name: Bare type invocation keeps argv aligned
        # Regression guard: argv[0] used to leak the script path into the type
        # name whenever no argument in the call started with `--`.
        run: |
          out=$(moon run --target js cmd/main -- dateTime 2026-02-30T00:00:00 2026-02-28T00:00:00)
          echo "$out"
          echo "$out" | grep -qF 'INVALID  dateTime  2026-02-30T00:00:00'
          echo "$out" | grep -qF 'valid    dateTime  2026-02-28T00:00:00'
          ! echo "$out" | grep -q 'main.js'

      - name: Coverage
        # Printed for visibility, and held to a floor so the number cannot drift
        # down unnoticed.
        run: |
          moon test --enable-coverage
          moon coverage report -f summary | tee coverage.txt
          awk -F'[:/ ]+' '/^Total:/ { if ($2/$3 < 0.80) { printf "coverage %.1f%% is below the 80%% floor\n", 100*$2/$3; exit 1 } }' coverage.txt
